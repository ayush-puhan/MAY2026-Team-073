openapi: 3.0.3
info:
  title: All platform APIs
  version: 1.0.0
  description: |
    API documentation for ClubConnect application

servers:
  - url: http://127.0.0.1:5000/api

tags:
  - name: Authentication
  - name: User Profile
  - name: Student
  - name: University
  - name: Admin
  - name: Announcements
  - name: Clubs
  - name: Calendar
  - name: Event Sessions
  - name: Club Members
  - name: Membership
  - name: Volunteer Tasks
  - name: Club Applications
  - name: Club Interests
  - name: Club Creation
  - name: Events
  - name: Event Registration
  - name: Event Attendance
  - name: Notifications
  - name: Emergency
  - name: Faculty Advisor
  - name: Rewards
  - name: University Admin

paths:

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate user using email and password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema: {}

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register User
      description: Register a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema: {}

  /auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp_code
              properties:
                email:
                  type: string
                  format: email
                otp_code:
                  type: string
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema: {}

  /auth/resend-otp:
    post:
      tags:
        - Authentication
      summary: Resend OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP resent
          content:
            application/json:
              schema: {}

  /auth/google:
    post:
      tags:
        - Authentication
      summary: Google Login
      description: Authenticate using Google ID token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Google authentication successful
          content:
            application/json:
              schema: {}

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema: {}

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Forgot Password
      description: Send password reset email or OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Password reset initiated
          content:
            application/json:
              schema: {}

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset Password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password reset successful
          content:
            application/json:
              schema: {}

  /auth/set-password:
    post:
      tags:
        - Authentication
      summary: Set Password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  format: password
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema: {}

  /users/profile:
    get:
      tags:
        - User Profile
      summary: Get User Profile
      security:
        - bearerAuth: []
      description: Returns the authenticated user's complete profile.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: {}

    patch:
      tags:
        - User Profile
      summary: Update User Profile
      security:
        - bearerAuth: []
      description: |
        Updates user profile including nested student profile and interests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                department_id:
                  type: integer
                profile_photo_url:
                  type: string
                student_profile:
                  type: object
                  properties:
                    program_id:
                      type: integer
                    academic_year:
                      type: integer
                    semester:
                      type: integer
                    batch:
                      type: string
                    section:
                      type: string
                interests:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema: {}

    delete:
      tags:
        - User Profile
      summary: Delete Account
      security:
        - bearerAuth: []
      description: Delete the authenticated user's account.
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema: {}

  /student/departments:
    get:
      tags:
        - Student
      summary: Get Departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema: {}

  /student/programs:
    get:
      tags:
        - Student
      summary: Get Programs
      responses:
        "200":
          description: List of programs
          content:
            application/json:
              schema: {}

  /student/interests:
    get:
      tags:
        - Student
      summary: Get Interests
      responses:
        "200":
          description: List of interests
          content:
            application/json:
              schema: {}

  /universities/domains:
    get:
      tags:
        - University
      summary: Get Valid University Email Domains
      responses:
        "200":
          description: List of valid domains
          content:
            application/json:
              schema: {}

  /admin/stats:
    get:
      tags:
        - Admin
      summary: Get Dashboard Statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema: {}

  /admin/users/recent:
    get:
      tags:
        - Admin
      summary: Get Recently Registered Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent users
          content:
            application/json:
              schema: {}

  /admin/support/recent:
    get:
      tags:
        - Admin
      summary: Get Recent Support Tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent support tickets
          content:
            application/json:
              schema: {}

  /admin/audit-logs:
    get:
      tags:
        - Admin
      summary: Get Audit Logs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Maximum number of audit log entries.
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema: {}

    post:
      tags:
        - Admin
      summary: Create Audit Log Entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
                - entity_type
                - entity_id
              properties:
                action:
                  type: string
                entity_type:
                  type: string
                entity_id:
                  type: integer
                details:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Audit log created
          content:
            application/json:
              schema: {}

  /admin/users:
    get:
      tags:
        - Admin
      summary: Get All Users
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: role
          required: false
          schema:
            type: string
          description: Filter users by role.
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema: {}

    post:
      tags:
        - Admin
      summary: Create User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: {}

  /admin/users/{id}:
    get:
      tags:
        - Admin
      summary: Get User By ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema: {}

    delete:
      tags:
        - Admin
      summary: Delete User
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema: {}

  /admin/users/{id}/status:
    patch:
      tags:
        - Admin
      summary: Update User Status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema: {}

  /admin/users/{userId}/role:
    patch:
      tags:
        - Admin
      summary: Assign User Role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
      responses:
        "200":
          description: Role assigned
          content:
            application/json:
              schema: {}

  /admin/roles:
    get:
      tags:
        - Admin
      summary: Get Available Roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available roles
          content:
            application/json:
              schema: {}

  /admin/analytics:
    get:
      tags:
        - Admin
      summary: Get Analytics
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: range
          required: false
          schema:
            type: string
            default: month
            enum:
              - day
              - week
              - month
              - year
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema: {}

  /admin/universities:
    get:
      tags:
        - Admin
      summary: Get Universities
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Universities
          content:
            application/json:
              schema: {}

    post:
      tags:
        - Admin
      summary: Create University
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: University created
          content:
            application/json:
              schema: {}

  /admin/universities/{id}:
    patch:
      tags:
        - Admin
      summary: Update University Settings
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: University updated
          content:
            application/json:
              schema: {}

  /admin/support:
    get:
      tags:
        - Admin
      summary: Get Support Tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema: {}

  /admin/support/{id}:
    get:
      tags:
        - Admin
      summary: Get Support Ticket By ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Support ticket details
          content:
            application/json:
              schema: {}

    patch:
      tags:
        - Admin
      summary: Update Support Ticket
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Support ticket updated
          content:
            application/json:
              schema: {}

  /admin/support/{id}/respond:
    post:
      tags:
        - Admin
      summary: Respond to Support Ticket
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Response submitted
          content:
            application/json:
              schema: {}

  /announcements:
    get:
      tags:
        - Announcements
      summary: Get Announcements
      description: |
        Returns announcements. Optionally filter by club or retrieve
        university announcements.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: club_id
          required: false
          schema:
            type: integer
          description: Filter announcements by club ID.
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum:
              - university
          description: Retrieve university-wide announcements.
      responses:
        "200":
          description: Announcements retrieved
          content:
            application/json:
              schema: {}

    post:
      tags:
        - Announcements
      summary: Create Announcement
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Announcement created
          content:
            application/json:
              schema: {}

  /calendar/events:
    get:
      tags:
        - Calendar
      summary: Get Calendar Events
      description: |
        Returns calendar event sessions visible to the authenticated user.
        Supports filtering by university, club, and public visibility.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: show_public
          required: false
          schema:
            type: boolean
          description: Include public events.
        - in: query
          name: university_id
          required: false
          schema:
            type: integer
          description: Filter by university.
        - in: query
          name: club_id
          required: false
          schema:
            type: integer
          description: Filter by club.
      responses:
        "200":
          description: Calendar events retrieved
          content:
            application/json:
              schema: {}

  /events/{eventId}/sessions:
    get:
      tags:
        - Event Sessions
      summary: Get Event Sessions
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event sessions
          content:
            application/json:
              schema: {}

    post:
      tags:
        - Event Sessions
      summary: Create Event Session
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: eventId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Event session created
          content:
            application/json:
              schema: {}

  /event-sessions/{sessionId}:
    patch:
      tags:
        - Event Sessions
      summary: Update Event Session
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event session updated
          content:
            application/json:
              schema: {}

    delete:
      tags:
        - Event Sessions
      summary: Delete Event Session
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event session deleted
          content:
            application/json:
              schema: {}

  /calendar/sync-google:
    post:
      tags:
        - Calendar
      summary: Sync Calendar to Google Calendar
      description: Synchronizes the authenticated user's calendar events with Google Calendar.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Calendar synchronized
          content:
            application/json:
              schema: {}

  /clubs:
    get:
      tags:
        - Clubs
      summary: Get Clubs
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: university_id
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Clubs retrieved
          content:
            application/json:
              schema: {}

  /clubs/{clubId}:
    get:
      tags:
        - Clubs
      summary: Get Club By ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club details
          content:
            application/json:
              schema: {}

  /users/{userId}/clubs:
    get:
      tags:
        - Clubs
      summary: Get User Clubs
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User clubs
          content:
            application/json:
              schema: {}

  /clubs/{clubId}/members:
    get:
      tags:
        - Club Members
      summary: Get Club Members
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club members
          content:
            application/json:
              schema: {}

  /clubs/{clubId}/members/{userId}/role:
    get:
      tags:
        - Club Members
      summary: Get User Role in Club
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            type: integer
        - in: path
          name: userId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User role
          content:
            application/json:
              schema: {}

  /clubs/{clubId}/membership-requests:
    get:
      tags:
        - Membership
      summary: Get Membership Requests
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership requests
          content:
            application/json:
              schema: {}

  /clubs/{clubId}/join:
    post:
      tags:
        - Membership
      summary: Join Club
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_in_club:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Join request submitted
          content:
            application/json:
              schema: {}

  /memberships/{membershipId}/approve:
    patch:
      tags:
        - Membership
      summary: Approve Membership
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Membership approved
          content:
            application/json:
              schema: {}

  /memberships/{membershipId}/reject:
    patch:
      tags:
        - Membership
      summary: Reject Membership
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Membership rejected
          content:
            application/json:
              schema: {}

  /memberships/{membershipId}/role:
    patch:
      tags:
        - Membership
      summary: Update Member Role
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema: {}

  /memberships/{membershipId}:
    delete:
      tags:
        - Membership
      summary: Remove Member
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema: {}

  /memberships/{membershipId}/leave:
    post:
      tags:
        - Membership
      summary: Leave Club
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: membershipId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left club
          content:
            application/json:
              schema: {}

  /clubs/{clubId}/tasks:
    get:
      tags:
        - Volunteer Tasks
      summary: Get Club Tasks
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clubId
          required: true
          schema:
            type: integer
        - in: query
          name: user_id
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Volunteer tasks
          content:
            application/json:
              schema: {}

  /volunteer-tasks:
    post:
      tags:
        - Volunteer Tasks
      summary: Create Volunteer Task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: integer
                assignee_membership_id:
                  type: integer
                task_description:
                  type: string
                due_at:
